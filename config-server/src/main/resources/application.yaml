server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Dinesh-Mane/config-server-repo
          clone-on-start: true
          default-label: master

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
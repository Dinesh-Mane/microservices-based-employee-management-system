spring:
  application:
    name: employee-service

  config:
    import: optional:configserver:http://localhost:8888

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "health,info,refresh,busrefresh"
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always